<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-light.png" id="favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ternssh — 开源 SSH 工作台。部署在 Cloudflare 边缘的 Web 端 + 原生 macOS / Windows 桌面客户端：终端、SFTP、状态监控、AI 命令，配置双向同步。"
    />
    <meta property="og:title" content="ternssh — 所有服务器，一个工作台" />
    <meta
      property="og:description"
      content="开源 SSH 工作台：Cloudflare 边缘 Web 端 + 原生桌面客户端。"
    />
    <meta property="og:image" content="/preview-dark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>ternssh — 开源 SSH 工作台 · Web 与桌面</title>
    <script>
      (function () {
        try {
          var m = localStorage.getItem("ternssh-website-theme") || "system";
          var d =
            m === "dark" ||
            (m === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.dataset.theme = d ? "dark" : "light";
          r.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
